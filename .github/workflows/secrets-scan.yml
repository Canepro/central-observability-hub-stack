name: Secrets scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    name: Gitleaks full history
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out all branch and tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -m 700 "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 700 "$install_dir/gitleaks"
      - name: Scan full history including merges
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scan_dir="$RUNNER_TEMP/gitleaks-scan"
          mkdir -m 700 "$scan_dir"
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/default.toml"
          : > "$scan_dir/empty.ignore"
          set +e
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git . \
            --log-opts='--all --full-history --diff-merges=first-parent --no-renames' \
            --config "$scan_dir/default.toml" \
            --gitleaks-ignore-path "$scan_dir/empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --timeout=1800 > "$scan_dir/scan.log" 2>&1
          scan_status=$?
          set -e
          if grep -Eqi '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)|deadline|context canceled|timed out' "$scan_dir/scan.log"; then
            echo '::error::Gitleaks did not complete. Coverage is incomplete; do not treat this result as clean.'
            exit 1
          fi
          if ! grep -Eq 'INF.*scanned .*bytes.* in ' "$scan_dir/scan.log"; then
            echo '::error::Gitleaks completion marker is missing. Coverage is unverified.'
            exit 1
          fi
          if [ "$scan_status" -ne 0 ]; then
            echo '::error::Gitleaks found potential secrets or could not scan. Review privately; never post matched values.'
            exit 1
          fi
          echo 'Gitleaks completed with zero unsuppressed findings.'
