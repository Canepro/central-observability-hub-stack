name: Secrets scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.deleted != true
    name: >-
      ${{ matrix.scope == 'full-history' && 'Gitleaks full history'
          || github.event_name == 'workflow_dispatch' && 'Gitleaks manual audit'
          || github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && 'Gitleaks ref changes'
          || 'Gitleaks new changes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scope: [new-changes, full-history]
    steps:
      - name: Check out branch and tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include public pull-request refs in the audit
        if: matrix.scope == 'full-history'
        run: |
          git -c credential.helper= fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" \
            '+refs/pull/*/head:refs/remotes/pull-head/*' \
            '+refs/pull/*/merge:refs/remotes/pull-merge/*'
        env:
          GIT_TERMINAL_PROMPT: '0'
      - name: Select the incoming range
        id: range
        shell: python
        env:
          SCAN_SCOPE: ${{ matrix.scope }}
        run: |
          import json, os, re, subprocess
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          tip = os.environ["GITHUB_SHA"]
          start = None
          if os.environ["SCAN_SCOPE"] == "full-history":
              selection = "--all"
          else:
              if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
                  start = event["pull_request"]["base"]["sha"]
                  tip = event["pull_request"]["head"]["sha"]
              elif os.environ["GITHUB_EVENT_NAME"] == "push":
                  start = event.get("before")
              if not re.fullmatch(r"[0-9a-f]{40,64}", tip):
                  raise SystemExit("Invalid commit identity")
              if start and not re.fullmatch(r"[0-9a-f]{40,64}", start):
                  raise SystemExit("Invalid base identity")
              available = start and set(start) != {"0"} and subprocess.run(
                  ["git", "cat-file", "-e", start + "^{commit}"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if available and os.environ["GITHUB_EVENT_NAME"] == "push":
                  available = subprocess.run(
                      ["git", "merge-base", "--is-ancestor", start, tip],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  ).returncode == 0
              selection = start + ".." + tip if available else tip
              if not available:
                  print("Base unavailable or non-forward push: scanning all history reachable from the tip")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("selection=" + selection + "\n")
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -m 700 "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 700 "$install_dir/gitleaks"
      - name: Scan selected changes including merges
        shell: bash
        env:
          SCAN_SELECTION: ${{ steps.range.outputs.selection }}
          SCAN_SCOPE: ${{ matrix.scope }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          umask 077
          scan_dir="$RUNNER_TEMP/gitleaks-scan"
          mkdir -m 700 "$scan_dir"
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/default.toml"
          : > "$scan_dir/baseline.ignore"
          # Gitleaks also loads .gitleaksignore from the scanned tree by itself, which would
          # let a change exempt its own findings. Remove it from this runner's checkout only.
          rm -f .gitleaksignore
          # Only the full-history audit uses the reviewed baseline, and it reads it from the
          # default branch, so a pull request cannot add its own exception.
          if [ "$SCAN_SCOPE" = full-history ]; then
            git show "refs/remotes/origin/$DEFAULT_BRANCH:.github/gitleaks-history-baseline" \
              > "$scan_dir/baseline.ignore" 2>/dev/null || : > "$scan_dir/baseline.ignore"
          fi
          set +e
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git . \
            --log-opts="$SCAN_SELECTION --full-history --diff-merges=first-parent --no-renames" \
            --config "$scan_dir/default.toml" \
            --gitleaks-ignore-path "$scan_dir/baseline.ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --timeout=1800 > "$scan_dir/scan.log" 2>&1
          scan_status=$?
          set -e
          python3 - "$scan_dir/scan.log" <<'SUMMARY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for pattern, label in [(r'(\d+) commits scanned', 'Commits with scanned patches'),
                                 (r'leaks found: (\d+)', 'Potential findings')]:
              matches = re.findall(pattern, text)
              if matches:
                  print(label + ': ' + matches[-1])
          SUMMARY
          if grep -Eqi '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)|deadline|context canceled|timed out' "$scan_dir/scan.log"; then
            echo '::error::Gitleaks did not complete. Coverage is incomplete.'
            exit 1
          fi
          if ! grep -Eq 'INF.*scanned .*bytes.* in ' "$scan_dir/scan.log"; then
            echo '::error::Gitleaks completion marker missing. Coverage is unverified.'
            exit 1
          fi
          if [ "$scan_status" -ne 0 ]; then
            echo '::error::Potential secrets or scan failure. Review privately; never post values.'
            exit 1
          fi
          echo 'Gitleaks completed with zero findings in the selected scope.'
